@let state = siteContentService.state();

@switch (state.status) {
  @case ('loading') {
    <main class="home-state app-container">
      <p role="status">Загрузка содержимого…</p>
    </main>
  }

  @case ('error') {
    <main class="home-state app-container">
      <section role="alert" aria-labelledby="content-error-title">
        <h1 id="content-error-title">Содержимое временно недоступно</h1>
        <p>{{ state.message }}</p>

        @if (state.detail) {
          <details>
            <summary>Технические подробности</summary>
            <code>{{ state.detail }}</code>
          </details>
        }

        <button type="button" (click)="onRetry()">Повторить загрузку</button>
      </section>
    </main>
  }

  @case ('ready') {
    <app-site-header [navigation]="state.content.navigation" />
    <main id="main-content">
      <app-hero-section [content]="state.content.hero" />
    </main>
  }
}
